# window properties
window.title=CPZ - SIM Datacenter UI
window.icon=logo.png
# sketch properties
sketch.width=1920
sketch.height=993
sketch.fps=60
sketch.smoothing=8
# number formats
number.format.percentage=%.0f%%
number.format.temperature=%.1f°C
number.format.temperature.simple=%.0f°C
number.format.power.kw=%.2fkW
number.format.power.mw=%.2fMW
number.format.speed=%.1fm/s
number.format.pressure=%.1f Pa
number.format.airflow=%.1f / %.1f m³/s
# layout properties
datacenter.first.column=C01
datacenter.last.column=C08
# simulation health properties
simulation.health.utilization.alert-threshold=0.90
simulation.health.utilization.recovery-threshold=0.85
simulation.health.temperature.alert-threshold-celsius=80.0
simulation.health.temperature.recovery-threshold-celsius=75.0
simulation.health.temperature.warning-threshold-celsius=65
# simulation timer properties
simulation.timer.base-period-ms=1000
simulation.timer.speed-factors=0.5,1,2,4,8,16
simulation.timer.initial-speed-factor=1
